<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ecf0f3;
        }
        .buttons{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .sciencetific{
           display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;  
            display: none;

        }
        button{
            padding:15px;
            border: none;
            outline: none;
            transition: 1s;
            border-radius: 4px;
            box-shadow: 5px 5px 8px #00000002 , -5px -5px 5px #ffffff;
        }
        button:hover{
            box-shadow: inset 8px 8px 8px #cbced1, inset -8px -8px 8px #ffffff;
        }
        #display{
          width: 93.5%;  
          font-size: 35px;
          outline: none;
          border: none;
          text-align: right;
           padding: 15px;
          border-radius: 6px;
          margin-bottom: 30px;
          color: black;
          box-shadow: inset 8px 8px 8px #cbced1, inset -8px -8px 8px #ffffff;
        }
        .container{
            padding: 20px;
            border-radius: 8px;
            box-shadow: 12px 12px 20px #cbced1, -12px -12px 20px #ffffff;
        }
       ::placeholder{
        color: black;
        }
        .equal{
            background-color: #33ccff;
            color: #fff;
            box-shadow: inset  5px 5px 8px #66d9ff, inset -5px -5px 8px #00ace6;
        }
        .equal:hover{
            box-shadow: inset  5px 5px 8px #66d9ff, inset -5px -5px 8px #66d9ff; ;
        }
        .oparator{
            background-color: rgb(22, 179, 22);
            color: white;
            box-shadow: inset  5px 5px 8px  rgb(19, 168, 19), inset -5px -5px 8px  rgb(17, 127, 17);
        }
        .oparator:hover{
            box-shadow: inset  5px 5px 8px  rgb(17, 65, 17), inset -5px -5px 8px  rgb(16, 110, 16); 
        }
        .clear{
            background-color: rgb(228, 23, 23);
            color: white;
            box-shadow: inset  5px 5px 8px rgb(249, 2, 2), inset -5px -5px 8px rgb(180, 3, 3);
        }
        .clear:hover{
           box-shadow: inset  5px 5px 8px rgb(138, 8, 8), inset -5px -5px 8px rgb(185, 17, 17); 
        }


    </style>
</head>
<body>
    <div class="container">
    <div class="calculator">
      <input type="text" id="display" placeholder="0" disabled />

      <div class="sciencetific" id="showsci">
        <button onclick="calsin()">sin</button>
        <button onclick="appendtoDisplay('(')">(</button>
        <button onclick="appendtoDisplay(')')">)</button>
        <button onclick="calpi()">pi</button>
        <button onclick="calcos()">cos</button>
        <button onclick="callog()">log</button>
        <button onclick="caltan()">tan</button>
        <button onclick="calsquare()">x²</button>
        <!-- <button onclick="appendtoDisplay('^2')">x²</button> -->
        <button onclick="calsquareroot('√')">√</button>
      </div>
      <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="clear" onclick="deleteLast()">DLE</button>
        <button onclick="appendtoDisplay('%')" class="oparator">%</button>
        <button onclick="appendtoDisplay('/')" class="oparator">/</button>

        <button onclick="appendtoDisplay('7')">7</button>
        <button onclick="appendtoDisplay('8')">8</button>
        <button onclick="appendtoDisplay('9')">9</button>
        <button onclick="appendtoDisplay('*')" class="oparator">*</button>

        <button onclick="appendtoDisplay('4')">4</button>
        <button onclick="appendtoDisplay('5')">5</button>
        <button onclick="appendtoDisplay('6')">6</button>
        <button onclick="appendtoDisplay('-')" class="oparator">-</button>

        <button onclick="appendtoDisplay('1')">1</button>
        <button onclick="appendtoDisplay('2')">2</button>
        <button onclick="appendtoDisplay('3')">3</button>
        <button onclick="appendtoDisplay('+')" class="oparator">+</button>


        <button onclick="appendtoDisplay('0')">0</button>
        <button onclick="appendtoDisplay('.')">.</button>
        <button onclick="calculateResult()" class="equal">=</button>
        <button id="show" class="clear">⁘</button>

      </div>
    </div>
    </div>

    






    <script src="./asscalculator.js"></script>
</body>
</html>
