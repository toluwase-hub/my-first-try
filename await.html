<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: aliceblue;
            margin: 0px;
            padding: 20px;
        }
        #userList{
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 0px;

        }
        .tolu{
         background-color: antiquewhite;
         border-radius: 15px;
         padding: 20px;
         box-shadow: 5px 5px 20px;
        }
        strong{
            display: block;
        }
        span{
            display: block;
            color: hsla(0, 2%, 25%, 0.97);
        }
        .dev{
            color: blue;
        }
        h2{
            text-align: center;
        }
    </style>
</head>
<body>
    
    <h2>User list</h2>

    <ul id="userList"></ul>


    <script src="./async.js"></script>
</body>
</html>
