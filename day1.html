      #countlabel{

        padding: 10px 20px;

        background-color: rgb(140, 140, 231);
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.25s;

      .button:hover{

      }

       #guess{
            padding:15px;
            border: none;
            outline: none;
            transition: 1s;
            border-radius: 4px;
            box-shadow: 5px 5px 8px #00000002 , -5px -5px 5px #ffffff;
            background-color: rgb(129, 209, 10);
            color: #ffffff;
        }
        #guess:hover{
            scale: 1.1;
          
        }
        .whole{
           
            padding: 20px;
            border-radius: 8px;
            box-shadow: 12px 12px 20px #cbced1, -12px -12px 20px #ffffff;
            max-width: 500px;
            margin: auto;
        }
                #guessinput{
          width: 93.5%;  
          outline: none;
          border: none;
           padding: 15px;
          border-radius: 6px;
          margin-bottom: 30px;
          color: black;
          box-shadow: inset 8px 8px 8px #cbced1, inset -8px -8px 8px #ffffff;
        }
        #message{
          font-size: 30px;
          font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;

          font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
          color: rgb(97, 158, 6);
        }
        #result{
         font-size: 30px;
          font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
          font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
          font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
          color: rgb(97, 158, 6); 
        }
        .num{
          color: rgb(102, 163, 12);
        }
